name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications/ | grep -i xcode || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest" || true; fi
          xcodebuild -version

      - name: Build (no signing)
        run: |
          xcodebuild -project B9XController.xcodeproj \
            -scheme B9XController \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          test -n "$APP"
          rm -rf Payload B9XController-unsigned.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r B9XController-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: B9XController-unsigned-ipa
          path: B9XController-unsigned.ipa

      - name: Publish IPA to release (latest-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp B9XController-unsigned.ipa "B9XController-$SHORT-unsigned.ipa"
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --title "Latest build" --notes "CI 自动构建的未签名 IPA" --prerelease
          gh release upload latest-build B9XController-unsigned.ipa "B9XController-$SHORT-unsigned.ipa" --clobber

  # 模拟器截图巡游：iPhone 16 Pro Max（iOS 26），每步单独启动一次
  #（-UITourStep N），simctl 每步截屏上传。固定步数不依赖计时，
  # 因为 simctl launch 在冷模拟器上返回晚，计时巡游会在截图前跑完。
  # 注：XCTest 方案已弃——runner 的 Xcode 26.6 解析不了 ui-testing
  # 产品类型（com.apple.product-type.ui-testing 在 iphonesimulator 域
  # 查不到），改用应用内巡游代替；巡游只改 UI 本地状态、不发 BLE。
  screenshot:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications/ | grep -i xcode || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest" || true; fi
          xcodebuild -version
          xcrun simctl list devices available | grep -i "iPhone 16 Pro Max" || true

      - name: Prepare iPhone 16 Pro Max simulator
        run: |
          if xcrun simctl list devices available | grep -q "iPhone 16 Pro Max"; then
            echo "iPhone 16 Pro Max simulator already exists"
          elif xcrun simctl list devicetypes | grep -q "iPhone-16-Pro-Max"; then
            xcrun simctl create "iPhone 16 Pro Max" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max
          else
            echo "No iPhone 16 Pro Max device type; falling back to iPhone 17 Pro Max (same 440x956pt screen)"
            xcrun simctl create "iPhone 16 Pro Max" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max || true
          fi
          xcrun simctl list devices available | grep -i "iPhone 16 Pro Max" || true

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project B9XController.xcodeproj \
            -scheme B9XController \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build-sim

      - name: Run tour and screenshot
        run: |
          SIM=$(xcrun simctl list devices available | grep "iPhone 16 Pro Max" | tail -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "simulator: $SIM"
          test -n "$SIM"
          xcrun simctl boot "$SIM" || true
          xcrun simctl install "$SIM" build-sim/Build/Products/Debug-iphonesimulator/B9XController.app
          mkdir -p sim-screenshots
          # 固定步数巡游：每步单独启动一次（-UITourStep N），不等时间、
          # 只等状态。simctl launch 在冷模拟器上返回晚，计时巡游会在
          # 截图前就跑完（三个 run 的首张截图角标都是 9/9）。
          # 每次先 terminate，保证是全新启动；启动后等 4 秒（冷启动 +
          # 0.6 秒设步数 + 弹簧动画）再截屏。冷启动慢时第一张常是黑屏
          #（只有约 84KB，真界面 500KB+），截到黑屏就等 2 秒重截，最多 6 次。
          shot() {
            local out="$1" n=0
            while [ $n -lt 6 ]; do
              xcrun simctl io "$SIM" screenshot "$out"
              if [ "$(stat -f%z "$out")" -gt 200000 ]; then return 0; fi
              n=$((n + 1))
              sleep 2
            done
          }
          i=0
          for name in home-smart manual free battery target overclock automation my legal back-home bottom lab-risk lab my-mid; do
            xcrun simctl terminate "$SIM" com.enginecore.plus 2>/dev/null || true
            xcrun simctl launch "$SIM" com.enginecore.plus -UITour -UITourStep $i
            sleep 4
            if [ "$i" = "0" ]; then
              shot "sim-screenshots/01-$name.png"
            else
              shot "sim-screenshots/02-$name.png"
            fi
            i=$((i + 1))
          done
          # 点按穿透测试：单独启动一次（-UITapTest，不带巡游），等 harness
          # 跑完（2.5s 延迟 + 3 个 tab 各 0.6s）再截屏，verdicts 写在屏上。
          xcrun simctl terminate "$SIM" com.enginecore.plus 2>/dev/null || true
          xcrun simctl launch "$SIM" com.enginecore.plus -UITapTest
          sleep 8
          shot "sim-screenshots/03-taptest.png"
          # 实验室红线测试：四种中止场景各单独启动一次
          #（-UILabTest <场景>，假数据只改 demo 状态、不发 BLE）。
          # 巡游第 12 步进实验室页，驱动自动跑测试；等中止后截屏，
          # abort 原因写在结果卡上。rpmfall 要跑满基准 20s + 两档各 15s。
          for scenario in hotprotect hotrise disconnect; do
            xcrun simctl terminate "$SIM" com.enginecore.plus 2>/dev/null || true
            xcrun simctl launch "$SIM" com.enginecore.plus -UITour -UITourStep 12 -UILabTest $scenario
            sleep 20
            shot "sim-screenshots/03-labtest-$scenario.png"
          done
          xcrun simctl terminate "$SIM" com.enginecore.plus 2>/dev/null || true
          xcrun simctl launch "$SIM" com.enginecore.plus -UITour -UITourStep 12 -UILabTest rpmfall
          sleep 75
          shot "sim-screenshots/03-labtest-rpmfall.png"
          ls -la sim-screenshots/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: sim-screenshots
